name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-e2e:
    name: Horizon ${{ matrix.horizon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        horizon: ["2.8.4","2.9.5" ,"2.10.7", "2.11.0"]
    env:
      HORIZON_IMAGE_TAG: ${{ matrix.horizon }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Fetch Harbor credentials via Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: ${{ vars.VAULT_AUTH_METHOD }}
          path: ${{ vars.VAULT_AUTH_PATH }}
          secrets: |
            ci/data/repositories/evertrust/horizon-issuer/registry host | REGISTRY_HOST ;
            ci/data/repositories/evertrust/horizon-issuer/registry username | REGISTRY_USERNAME ;
            ci/data/repositories/evertrust/horizon-issuer/registry password | REGISTRY_PASSWORD ;

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Disable containerd image store
        # Workaround for https://github.com/kubernetes-sigs/kind/issues/3795
        run: |
          sudo mkdir -p /etc/docker
          docker --version || true
          containerd --version || true
          [ -s "/etc/docker/daemon.json" ] && {
            cat "/etc/docker/daemon.json" | jq '. + {"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
          } || {
            echo '{"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
          }
          sudo mv -f /etc/docker/daemon.$$ /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Fetch license
        run: |
          printf "${{ secrets.LICENSE }}" >> test/assets/horizon.lic

      - name: Run E2E tests
        env:
          HORIZON_IMAGE: ${{ env.REGISTRY_HOST }}/library/horizon:${{ matrix.horizon }}
        run: mise test:e2e
