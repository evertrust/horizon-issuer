name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Create a prerelease"
        required: false
        default: false
        type: boolean

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: ${{ github.event.inputs.prerelease == 'true' && '.github/release-please-prerelease-config.json' || '.github/release-please-config.json' }}
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Fetch Harbor credentials via Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: ${{ vars.VAULT_AUTH_METHOD }}
          path: ${{ vars.VAULT_AUTH_PATH }}
          secrets: |
            ci/data/repositories/evertrust/horizon-issuer/registry host | REGISTRY_HOST ;
            ci/data/repositories/evertrust/horizon-issuer/registry username | REGISTRY_USERNAME ;
            ci/data/repositories/evertrust/horizon-issuer/registry password | REGISTRY_PASSWORD ;

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Release assets
        env:
          NEXUS_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: mise publish
