apiVersion: horizon.evertrust.io/v1beta1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/name: horizon-issuer
    app.kubernetes.io/managed-by: kustomize
  name: issuer-sample
spec:
  url: https://horizon.yourcompany.com
  profile: kubernetes
  # Authenticate with a JWKS service account declared in Horizon. The
  # controller requests a short-lived token for the referenced Kubernetes
  # ServiceAccount (in this namespace) and sends it on every call.
  serviceAccount:
    name: horizon-issuer
    serviceAccountRef:
      name: horizon-issuer
      # Optional. Defaults to the Horizon URL.
      # audiences:
      #   - https://horizon.yourcompany.com
